# Guest nix configuration for the Gondolin sandbox. Replaces the Alpine
# default wholesale during image build (unprivileged copy, not chroot append).
allowed-users = @nix
max-jobs = 4
# Single-user root builds; Alpine's default nixbld group does not exist here.
build-users-group =
experimental-features = nix-command flakes pipe-operators
# Mirror modules/core/nix.nix so every invocation uses the same caches
# (oak's Hydra first), regardless of which flake — if any — drives it.
substituters = https://cache.oak.decent.id https://cache.nixos-cuda.org
trusted-public-keys = cache.oak.decent.id:rf560rkaTPzpc8cg56bnPmmgqro8Lbn624jJSDF5YyY= cache.nixos-cuda.org:74DUi4Ye579gUqzH4ziL9IyiJBlDpMRn9MBN8oNan9M=
# Ephemeral single-user root sandbox: also auto-accept flake-declared
# settings (extra substituters, IFD, ...) instead of prompting.
accept-flake-config = true
